[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infodiff"
version = "0.1.0"
description = "Echo-corrected information diffusion: multiscale phase-type Hawkes models of macro-news absorption"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "numba", "pandas", "polars", "pyarrow", "torch", "requests", "python-dotenv", "statsmodels", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
baselines = ["tick"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
