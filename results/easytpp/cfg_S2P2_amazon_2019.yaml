S2P2_train:
  base_config:
    backend: torch
    base_dir: D:\Quant\results\easytpp\checkpoints/
    dataset_id: amazon
    model_id: S2P2
    runner_id: std_tpp
    stage: train
  model_config:
    hidden_size: 128
    loss_integral_num_sample_per_step: 10
    model_specs:
      P: 16
      act_func: gelu
      dropout_rate: 0.1
      for_loop: false
      int_backward_variant: true
      int_forward_variant: false
      post_norm: true
      pre_norm: false
      relative_time: true
    num_layers: 4
    use_mc_samples: true
  trainer_config:
    batch_size: 128
    gpu: 0
    learning_rate: 0.01
    lr_decay_style: cosine
    lr_scheduler: true
    max_epoch: 300
    metrics: []
    optimizer: adam
    seed: 2019
    shuffle: true
    use_tfb: false
    valid_freq: 1
    warmup_pct: 0.01
    weight_decay: 0.0
data:
  amazon:
    data_format: json
    data_specs:
      num_event_types: 16
      pad_token_id: 16
      padding_side: right
      truncation_side: right
    test_dir: D:\Quant\data\raw\easytpp\amazon_test.json
    train_dir: D:\Quant\data\raw\easytpp\amazon_train.json
    valid_dir: D:\Quant\data\raw\easytpp\amazon_validation.json
pipeline_config_id: runner_config
